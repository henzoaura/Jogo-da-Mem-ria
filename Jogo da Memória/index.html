<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória - Palmeiras</title>
  <!-- Link para o arquivo de estilização do CSS corrigido dentro do head -->
  <link rel="stylesheet" href="Css/style.css">
</head>

<body>   
  <section class="header">
    <h1>Jogo da memória</h1>
    <button id="start">Iniciar</button>
    <span id="timer">00:00</span>  
  </section>

  <!-- Início do container principal -->
  <section class="memory-game">    
  
    <!-- Início das seções dos cards - 12 cards (cartões) do Verdão -->
    <section class="memory-card" data-framework="estevao">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/guloso.png" alt="Estêvão" />
    </section>

    <section class="memory-card" data-framework="veiga">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/veiga.png" alt="Raphael Veiga" />
    </section>

    <section class="memory-card" data-framework="gomez">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/gomez.png" alt="Gustavo Gómez" />
    </section>

    <section class="memory-card" data-framework="dudu">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/dudu.png" alt="Dudu" />
    </section>

    <section class="memory-card" data-framework="weverton">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/wev.png" alt="Weverton" />
    </section>

    <section class="memory-card" data-framework="rony">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/rony.png" alt="Rony" />
    </section>

    <!-- Pares correspondentes -->
    <section class="memory-card" data-framework="rony">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/rony.png" alt="Rony" />
    </section>

    <section class="memory-card" data-framework="gomez">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/gomez.png" alt="Gustavo Gómez" />
    </section>

    <section class="memory-card" data-framework="dudu">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/dudu.png" alt="Dudu" />
    </section>

    <section class="memory-card" data-framework="veiga">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/veiga.png" alt="Raphael Veiga" />
    </section>

    <section class="memory-card" data-framework="weverton">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/wev.png" alt="Weverton" />
    </section>

    <section class="memory-card" data-framework="estevao">
      <img class="front-face" src="img/palmeiras.png" alt="Palmeiras" />
      <img class="back-face" src="img/guloso.png" alt="Estêvão" />
    </section>
    <!-- Fim das seções dos cards-->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript -->
  <script src="Js/java.js"></script>
</body>
</html>
